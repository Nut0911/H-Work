<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Work Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="/picture/Logo.png" alt="Logo" class="main-logo">
            <span class="logo-text">H-WORK</span>
        </div>
        <nav>
            <a href="/signup.html" class="active">Sign Up</a>
            <button class="btn-login-nav">Log In</button>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Create an Account</h1>
            <p class="subtitle">Join the curated ecosystem for elite developers.</p>

            <div class="toggle-container">
                <div class="toggle-slider"></div>
                <button class="toggle-btn active" onclick="moveSlider(0)">Developer</button>
                <button class="toggle-btn" onclick="moveSlider(1)">Hiring Company</button>
            </div>

            <form>
                <div class="input-group">
                    <label>FULL NAME</label>
                    <input type="text" required>
                </div>
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" required>
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>CONFIRM PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" required>
                    </div>
                </div>
                <button type="submit" class="btn-signup">Sign Up</button>
            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <div class="social-login">
                <button class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
                <button class="social-btn"><i class="fa-brands fa-github"></i> Github</button>
            </div>

            <p class="footer-link">Already have an account? <a href="#">Login</a></p>
        </div>
    </main>

    <script>
        function moveSlider(index) {
            const slider = document.querySelector('.toggle-slider');
            const buttons = document.querySelectorAll('.toggle-btn');

            slider.style.transform = `translateX(${index * 100}%)`;

            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }
    </script>
</body>

</html>
