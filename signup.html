<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Work Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <div class="logo-container">
            <a href="/index.html"><img src="picture/Logo3.png" alt="Logo" class="main-logo"></a>
            <span class="logo-text">H-WORK</span>
        </div>
        <nav>
            <a href="/signup.html" class="active">Sign Up</a>
            <a href="/login.html"><button class="btn-login-nav">Log In</button></a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Create an Account</h1>
            <p class="subtitle">Join the curated ecosystem for elite developers.</p>

            <form>
                <div class="input-group">
                    <label>FULL NAME</label>
                    <input type="text" required>
                </div>
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" required>
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>CONFIRM PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password" required>
                    </div>
                </div>
                <a href="/index.html"><button type="button" class="btn-signup">Sign Up</button></a>
            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <div class="social-login">
                <button class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
                <button class="social-btn"><i class="fa-brands fa-github"></i> Github</button>
            </div>

            <p class="footer-link">Already have an account? <a href="#">Login</a></p>
        </div>
    </main>

    <footer class="login-footer">
        <div class="footer-left">
            <p>© 2026 H-WORK. BUILT FOR THE ELITE DEVELOPERS.</p>
        </div>
        <div class="footer-right">
            <a href="#">DOCUMENTATION</a>
            <a href="#">PRIVACY</a>
        </div>
    </footer>

</body>

</html>
