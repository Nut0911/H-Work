<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Work Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>


<body>

    <header class="navbar">
        <div class="logo">H-WORK</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Job Board</a>
            <a href="#" class="active">Sign Up</a>
            <button class="btn-login-nav">Log In</button>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Create an Account</h1>
            <p class="subtitle">Join the curated ecosystem for elite developers.</p>

            <div class="toggle-container">
                <div class="toggle-slider"></div> <button class="toggle-btn active"
                    onclick="moveSlider(0)">Developer</button>
                <button class="toggle-btn" onclick="moveSlider(1)">Hiring Company</button>
            </div>

            <form>
                <div class="input-group">
                    <label>FULL NAME</label>
                    <input type="text" placeholder="">
                </div>
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" placeholder="">
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password">
                    </div>
                </div>
                <div class="input-group">
                    <label>CONFIRM PASSWORD</label>
                    <div class="password-wrapper">
                        <input type="password">
                    </div>
                </div>

                <button type="submit" class="btn-signup">Sign Up</button>
            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <div class="social-login">
                <button class="social-btn"><i class="fa-brands fa-google"></i>Google</button>
                <button class="social-btn">
                    <i class="fa-brands fa-github"></i>
                    Github
                </button>
            </div>

            <p class="footer-link">Already have an account? <a href="#">Login</a></p>
        </div>
    </main>
    <script>
        // ดึงปุ่มทั้งหมดใน toggle-container ออกมา
        const toggleButtons = document.querySelectorAll('.toggle-btn');

        toggleButtons.forEach(button => {
            button.addEventListener('click', () => {
                // ลบคลาส 'active' ออกจากทุกปุ่มก่อน
                toggleButtons.forEach(btn => btn.classList.remove('active'));

                // เพิ่มคลาส 'active' ให้กับปุ่มที่ถูกคลิก
                button.classList.add('active');
            });
        });

        // เรียกใช้ Lucide Icons (ถ้ายังไม่ได้ใส่)
        lucide.createIcons();

        function moveSlider(index) {
            const slider = document.querySelector('.toggle-slider');
            const buttons = document.querySelectorAll('.toggle-btn');

            // เลื่อน Slider: ถ้า index 0 อยู่ที่เดิม (0%), ถ้า index 1 เลื่อนไปขวา (100%)
            slider.style.transform = `translateX(${index * 100}%)`;

            // สลับคลาส active ให้ตัวหนังสือเปลี่ยนสี
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
    </script>
</body>

</html>
