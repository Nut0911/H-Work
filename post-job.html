<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - H-WORK</title>
    <link rel="stylesheet" href="post-job.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><h2>H-WORK</h2></div>
            <ul class="nav-menu">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="Jobboroad DEV-Hwork.html">Job Board</a></li>
                <li><a href="#">Company</a></li>
            </ul>
            <div class="nav-actions">
                <button class="icon-btn">🔔</button>
                <button class="nav-btn-primary">Post a Job</button>
                <div class="user-avatar"></div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="header-section">
            <span class="badge">HIRING PORTAL</span>
            <h1>Create a New <br><span class="highlight">Opportunity.</span></h1>
            
            <div class="role-selector">
                <button class="role-btn active">Developer</button>
                <button class="role-btn">Hiring Company</button>
            </div>
        </div>

        <div class="form-card">
            <form id="jobForm">
                <div class="input-group">
                    <label>JOB TITLE</label>
                    <input type="text" placeholder="e.g. Senior Full-Stack Architect" required>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>JOB CATEGORY</label>
                        <select>
                            <option>Engineering</option>
                            <option>Design</option>
                            <option>Marketing</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>WORK TYPE</label>
                        <select>
                            <option>Remote</option>
                            <option>On-site</option>
                            <option>Hybrid</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>JOB DESCRIPTION</label>
                    <div class="editor-toolbar">
                        <span>B</span> <span>I</span> <span>list</span> <span>link</span>
                    </div>
                    <textarea placeholder="Outline the core responsibilities..."></textarea>
                </div>

                <div class="input-group">
                    <label>TECHNICAL STACK</label>
                    <div class="skills-container" id="skillsList">
                        <span class="skill-tag">React ✕</span>
                        <span class="skill-tag">TypeScript ✕</span>
                        <span class="skill-tag">Node.js ✕</span>
                        <button type="button" class="add-skill-btn">+ Add Skill</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>SALARY RANGE (ANNUAL USD)</label>
                    <div class="row">
                        <input type="number" placeholder="$ Min">
                        <input type="number" placeholder="$ Max">
                    </div>
                </div>

                <div class="form-footer">
                    <button type="button" class="btn-text">💾 Save as Draft</button>
                    <button type="submit" class="btn-continue">Continue</button>
                </div>
            </form>
        </div>

        <div class="tip-card">
            <div class="tip-icon">💡</div>
            <div class="tip-content">
                <strong>Architect's Tip</strong>
                <p>Listings with precise tech stacks and salary ranges receive <span class="blue-text">42% more applications</span>.</p>
            </div>
        </div>
    </main>

    <script src="post-job.js"></script>
</body>
</html>
