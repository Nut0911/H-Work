<!DOCTYPE html>
<html lang="lo">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-WORK Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="navbar">
        <div class="logo-container">
            <a href="/index.html"><img src="picture/Logo3.png" alt="Logo" class="main-logo"></a>
            <span class="logo-text">H-WORK</span>
        </div>
        <nav>
            <a href="/signup.html"><button class="btn-nav-style">Sign Up</button></a>
            <a href="/login.html" class="active">Log In</a>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details to sign in.</p>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <div class="input-wrapper">
                        <i class="icon-mail"></i> <input type="email" id="email">
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">PASSWORD</label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="icon-lock"></i>
                        <input type="password" id="password">
                    </div>
                </div>

                <a href="/index.html"><button type="button" class="btn-login-main">Login</button></a>
            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <div class="social-login">
                <button class="btn-social">
                    <i class="fa-brands fa-google"></i> Google
                </button>
                <button class="btn-social">
                    <i class="fa-brands fa-github"></i> Github
                </button>
            </div>

            <p class="signup-footer">
                Don't have an account? <a href="/signup.html">Sign Up</a>
            </p>
        </div>
    </main>

    <footer class="login-footer">
        <div class="footer-left">
            <p>© 2026 H-WORK. BUILT FOR THE ELITE DEVELOPERS.</p>
        </div>
        <div class="footer-right">
            <a href="#">DOCUMENTATION</a>
            <a href="#">PRIVACY</a>
        </div>
    </footer>
</body>

</html>
